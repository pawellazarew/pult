[package]
name = "pult-r1"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
