[package]
name = "pult-core"
version = "0.3.21"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "pultd-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
fs2 = "0.4"
nix = { version = "0.30", features = ["signal"] }
regex = "1"
ryu-js = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
subtle = "2"
sys-locale = "0.3.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
